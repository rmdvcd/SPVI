workflows:
  ios-simulator-and-release:
    name: SPVI iOS Build (App Preview & Simulator)
    instance_type: mac_mini_m2
    max_build_duration: 30
    working_directory: flutter_app
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials # Configurable en Codemagic si se desea firma de distribución
    scripts:
      - name: Instalar dependencias de Flutter
        script: |
          flutter packages pub get
      - name: Ejecutar pruebas unitarias de Flutter
        script: |
          flutter test
      - name: Instalar CocoaPods
        script: |
          cd ios
          pod install
      - name: Compilar para Simulador iOS (App Preview / Pruebas sin Mac)
        script: |
          # Genera el build .app para el simulador de iOS (arquitectura x86_64 / arm64 sim)
          flutter build ios --simulator --debug
      - name: Empaquetar .app para Codemagic App Preview y descarga
        script: |
          cd build/ios/iphonesimulator
          zip -r -X SPVI-Simulator.zip Runner.app
      - name: Compilar iOS Release (Firma automática o no firmada para distribución)
        script: |
          # Si no hay certificados configurados compila sin firmar; si Codemagic tiene firma automática usará los perfiles aprovisionados
          flutter build ipa --no-codesign
    artifacts:
      - flutter_app/build/ios/iphonesimulator/SPVI-Simulator.zip
      - flutter_app/build/ios/archive/Runner.xcarchive
      - flutter_app/build/ios/ipa/*.ipa
    # Sin `publishing.email`: llevaba un correo de ejemplo (user@example.com, auditoría I-08) que no
    # es de nadie. Quien use Codemagic debe poner aquí su correo real o activar las notificaciones
    # en la interfaz de Codemagic. Los artefactos quedan disponibles igualmente en la corrida.
