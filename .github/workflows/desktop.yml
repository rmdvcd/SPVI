name: Escritorio Windows
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: desktop/requirements.txt
      - name: Probar, empaquetar y verificar el ejecutable
        shell: pwsh
        run: ./desktop/build_windows.ps1
      - name: Entregar portable y suma SHA-256
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SPVI-Windows-portable
          path: |
            desktop/dist/SPVI.exe
            desktop/dist/SPVI.exe.sha256
            desktop/dist/LEEME.md
          if-no-files-found: error
          retention-days: 14
