  <text x="646" y="267" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0B7A5E">Hasta 10 Secundarias</text>
  <text x="646" y="284" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.6" fill="#5F6368">5 incluidas en la prueba gratis</text>
  <text x="604" y="310" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.9" fill="#1A1C1E">• Sincroniza sola al abrir su turno</text>
  <text x="604" y="329" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.9" fill="#1A1C1E">• Sincroniza sola al pedir el cierre</text>
  <text x="604" y="348" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.9" fill="#1A1C1E">• Avisa si el dueño cambió catálogo</text>
  <text x="604" y="366" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.9" fill="#1A1C1E">• Permisos ajustables al instante</text>
