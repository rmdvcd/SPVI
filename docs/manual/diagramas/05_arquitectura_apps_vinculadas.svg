  <text x="440" y="416" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.3" font-weight="bold" fill="#2B4FA3" text-anchor="middle">Cobro inteligente por transferencia en empleados:</text>
  <text x="440" y="435" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1A1C1E" text-anchor="middle">El dinero entra directo a la tarjeta elegida por el dueño, pero el SMS de confirmación le llega al teléfono del empleado.</text>
