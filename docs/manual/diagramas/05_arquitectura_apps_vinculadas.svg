  <text x="80" y="113" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF">App Principal (Dueño)</text>
  <text x="80" y="130" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.8" fill="#DCE6FF">1 teléfono por negocio</text>
  <text x="38" y="166.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.1" fill="#1A1C1E">• Guarda toda la base de datos</text>
  <text x="38" y="188.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.1" fill="#1A1C1E">• Tiene la licencia activa</text>
  <text x="38" y="210.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.1" fill="#1A1C1E">• Crea catálogo, precios y fotos</text>
  <text x="38" y="232.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.1" fill="#1A1C1E">• Genera el código QR por empleado</text>
  <text x="38" y="254.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.1" fill="#1A1C1E">• Elige qué permisos tiene cada uno</text>
  <text x="38" y="276.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.1" fill="#1A1C1E">• Elige a qué tarjeta cobra cada uno</text>
  <text x="38" y="298.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.1" fill="#1A1C1E">• Ve quién está «Conectada ahora»</text>
  <text x="38" y="320.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.1" fill="#1A1C1E">• Aprueba o rechaza cierres de turno</text>
  <text x="38" y="342.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.1" fill="#1A1C1E">• Reparte actualizaciones por Wi-Fi</text>
