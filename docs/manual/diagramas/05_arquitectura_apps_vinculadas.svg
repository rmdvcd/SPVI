  <text x="646" y="117" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#B4541A">Secundaria · Empleado 1</text>
  <text x="646" y="134" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.6" fill="#5F6368">Recibe catálogo + fotos</text>
  <text x="604" y="160" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.9" fill="#1A1C1E">• Abre su turno y escribe su fondo</text>
  <text x="604" y="179" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.9" fill="#1A1C1E">• Su QR lleva su propio móvil (SMS)</text>
  <text x="604" y="198" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.9" fill="#1A1C1E">• Sigue vendiendo aunque caiga Wi-Fi</text>
  <text x="604" y="216" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.9" font-weight="bold" fill="#B4541A">• Toca «Sincronizar ahora» al enviar</text>
