  <text x="26" y="29" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">Trabajo en equipo: App Principal y Apps Secundarias</text>
  <text x="26" y="49" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#DCE6FF">Sincronización segura por la red local del negocio sin depender de internet</text>
