  <text x="366" y="137" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1A1C1E">Rápido en un solo paso</text>
  <text x="328" y="166" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.3" fill="#1A1C1E">• Muestra el Comprobante de pago con el total.</text>
