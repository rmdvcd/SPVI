  <text x="332" y="369.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1A1C1E">2. Datos del cliente:</text>
  <text x="332" y="385.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#5F6368">nombre, CI y móvil (marca «Cliente fijo» para recordarlo).</text>
