  <text x="74.0" y="113.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1A1C1E">1. Abrir turno</text>
  <text x="119.0" y="158.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1A1C1E" text-anchor="middle">En Inicio activa el</text>
  <text x="119.0" y="179.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1A1C1E" text-anchor="middle">interruptor del turno.</text>
  <text x="119.0" y="200.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1A1C1E" text-anchor="middle">Escribe el Fondo de</text>
  <text x="119.0" y="221.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1A1C1E" text-anchor="middle">caja inicial (o 0 CUP).</text>
