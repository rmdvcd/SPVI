  <text x="26" y="29" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">Ciclo de la jornada de trabajo y arqueo de caja</text>
  <text x="26" y="49" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#DCE6FF">Regla fundamental: sin turno abierto no se puede vender · Conciliación al cierre en 3 pasos</text>
