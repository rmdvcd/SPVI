  <text x="74" y="403" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1A1C1E">¿Qué cambia en la app de un empleado?</text>
  <text x="74" y="421" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1A1C1E">El empleado hace el mismo conteo, pero su confirmación envía una solicitud: solo el encargado aprueba el cierre en Apps vinculadas.</text>
