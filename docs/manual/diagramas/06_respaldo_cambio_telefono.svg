  <circle cx="265.0" cy="114.0" r="15.0" fill="#2F6F80"/>
  <g transform="translate(256.36, 105.36) scale(0.720)"><path d="M 18 8 h -1 V 6 c 0 -2.76 -2.24 -5 -5 -5 S 7 3.24 7 6 v 2 H 6 c -1.1 0 -2 .9 -2 2 v 10 c 0 1.1 .9 2 2 2 h 12 c 1.1 0 2 -.9 2 -2 V 10 c 0 -1.1 -.9 -2 -2 -2 z m -6 9 c -1.1 0 -2 -.9 -2 -2 s .9 -2 2 -2 2 .9 2 2 -.9 2 -2 2 z m 3.1 -9 H 8.9 V 6 c 0 -1.71 1.39 -3.1 3.1 -3.1 1.71 0 3.1 1.39 3.1 3.1 v 2 z" fill="#FFFFFF"/></g>
  <text x="287.0" y="111.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.2" font-weight="bold" fill="#1A1C1E">2. Archivo .shalev</text>
  <text x="287.0" y="127.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.1" fill="#5F6368">Copia completa cifrada</text>
  <text x="333.0" y="168.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.1" fill="#1A1C1E" text-anchor="middle">Incluye productos, recetas,</text>
  <text x="333.0" y="192.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.1" fill="#1A1C1E" text-anchor="middle">insumos, turnos, ventas,</text>
  <text x="333.0" y="216.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.1" fill="#1A1C1E" text-anchor="middle">clientes fijos y el ID de</text>
  <text x="333.0" y="240.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.1" fill="#1A1C1E" text-anchor="middle">tu licencia para migrarla.</text>
  <text x="333.0" y="264.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.1" fill="#1A1C1E" text-anchor="middle">(No incluye fotos ni clave).</text>
  <line x1="430.0" y1="200.0" x2="442.0" y2="200.0" stroke="#2F6F80" stroke-width="2.2"/>
  <polygon points="450.0,200.0 440.0,194.5 440.0,205.5" fill="#2F6F80"/>
  <rect x="455.0" y="91.0" width="188.0" height="224.0" rx="14.0" fill="#E2E7F0"/>
  <rect x="453.0" y="88.0" width="188.0" height="224.0" rx="14.0" fill="#FFFFFF" stroke="#0B7A5E" stroke-width="2.0"/>
  <rect x="453.0" y="88.0" width="188.0" height="52" rx="14" fill="#E1F5EE"/>
  <rect x="453.0" y="124.0" width="188.0" height="16" fill="#E1F5EE"/>
  <circle cx="479.0" cy="114.0" r="15.0" fill="#0B7A5E"/>
  <g transform="translate(470.36, 105.36) scale(0.720)"><path d="M 14 2 H 6 c -1.1 0 -1.99 .9 -1.99 2 L 4 20 c 0 1.1 .89 2 1.99 2 H 18 c 1.1 0 2 -.9 2 -2 V 8 l -6 -6 z m 4 18 H 6 V 4 h 7 v 5 h 5 v 11 z M 8 15.01 l 1.41 1.41 L 11 14.84 V 19 h 2 v -4.16 l 1.59 1.59 L 16 15.01 12.01 11 z" fill="#FFFFFF"/></g>
  <text x="501.0" y="111.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.2" font-weight="bold" fill="#1A1C1E">3. Teléfono nuevo</text>
  <text x="501.0" y="127.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.1" fill="#5F6368">Restaurar tus datos</text>
  <text x="547.0" y="168.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.1" fill="#1A1C1E" text-anchor="middle">Instala Shalev como Principal.</text>
  <text x="547.0" y="192.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.1" fill="#1A1C1E" text-anchor="middle">Ve a Respaldo → Importar,</text>
  <text x="547.0" y="216.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.1" fill="#1A1C1E" text-anchor="middle">elige el archivo .shalev</text>
  <text x="547.0" y="240.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.1" fill="#1A1C1E" text-anchor="middle">y escribe tu contraseña.</text>
  <text x="547.0" y="264.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.1" fill="#1A1C1E" text-anchor="middle">¡Todo tu negocio vuelve!</text>
  <line x1="644.0" y1="200.0" x2="656.0" y2="200.0" stroke="#0B7A5E" stroke-width="2.2"/>
  <polygon points="664.0,200.0 654.0,194.5 654.0,205.5" fill="#0B7A5E"/>
  <rect x="669.0" y="91.0" width="188.0" height="224.0" rx="14.0" fill="#E2E7F0"/>
