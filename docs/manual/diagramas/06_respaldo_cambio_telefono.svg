  <polygon points="236.0,200.0 226.0,194.5 226.0,205.5" fill="#2B4FA3"/>
  <rect x="241.0" y="91.0" width="188.0" height="224.0" rx="14.0" fill="#E2E7F0"/>
  <rect x="239.0" y="88.0" width="188.0" height="224.0" rx="14.0" fill="#FFFFFF" stroke="#2F6F80" stroke-width="2.0"/>
