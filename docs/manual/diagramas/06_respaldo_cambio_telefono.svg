  <rect x="667.0" y="88.0" width="188.0" height="52" rx="14" fill="#FDEEE4"/>
  <rect x="667.0" y="124.0" width="188.0" height="16" fill="#FDEEE4"/>
  <circle cx="693.0" cy="114.0" r="15.0" fill="#B4541A"/>
