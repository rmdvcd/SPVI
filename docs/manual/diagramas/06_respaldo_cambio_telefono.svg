<svg xmlns="http://www.w3.org/2000/svg" width="880" height="445" viewBox="0 0 880 445">
  <rect width="880" height="445" rx="18" fill="#F5F7FA" stroke="#CFD7E3" stroke-width="1.5"/>
  <rect x="0" y="0" width="880" height="62" rx="18" fill="#2B4FA3"/>
  <rect x="0" y="44" width="880" height="18" fill="#2B4FA3"/>
  <text x="26" y="29" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">Respaldo protegido (.shalev) y mudanza a un teléfono nuevo</text>
  <text x="26" y="49" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#DCE6FF">Cómo resguardar tu negocio y recuperar gratis tu licencia si cambias de equipo</text>
  <rect x="27.0" y="91.0" width="188.0" height="224.0" rx="14.0" fill="#E2E7F0"/>
  <rect x="25.0" y="88.0" width="188.0" height="224.0" rx="14.0" fill="#FFFFFF" stroke="#2B4FA3" stroke-width="2.0"/>
  <rect x="25.0" y="88.0" width="188.0" height="52" rx="14" fill="#E6EDFA"/>
  <rect x="25.0" y="124.0" width="188.0" height="16" fill="#E6EDFA"/>
  <circle cx="51.0" cy="114.0" r="15.0" fill="#2B4FA3"/>
  <g transform="translate(42.36, 105.36) scale(0.720)"><path d="M 16 1 H 8 C 6.34 1 5 2.34 5 4 v 16 c 0 1.66 1.34 3 3 3 h 8 c 1.66 0 3 -1.34 3 -3 V 4 c 0 -1.66 -1.34 -3 -3 -3 z m -2 20 h -4 v -1 h 4 v 1 z m 3.25 -3 H 6.75 V 4 h 10.5 v 14 z" fill="#FFFFFF"/></g>
  <text x="73.0" y="111.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.2" font-weight="bold" fill="#1A1C1E">1. Teléfono actual</text>
  <text x="73.0" y="127.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.1" fill="#5F6368">Antes de cambiar o guardar</text>
  <text x="119.0" y="168.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.1" fill="#1A1C1E" text-anchor="middle">Ve a Ajustes → Respaldo.</text>
  <text x="119.0" y="192.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.1" fill="#1A1C1E" text-anchor="middle">Deja activado «Proteger</text>
  <text x="119.0" y="216.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.1" fill="#1A1C1E" text-anchor="middle">con contraseña» y anótala.</text>
  <text x="119.0" y="240.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.1" fill="#1A1C1E" text-anchor="middle">Guarda en el teléfono o</text>
  <text x="119.0" y="264.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.1" fill="#1A1C1E" text-anchor="middle">envíalo a otra app segura.</text>
