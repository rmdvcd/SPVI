  <text x="715.0" y="111.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.2" font-weight="bold" fill="#1A1C1E">4. Pasar tu licencia</text>
  <text x="715.0" y="127.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.1" fill="#5F6368">Recuperación gratuita</text>
  <text x="761.0" y="168.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.1" fill="#1A1C1E" text-anchor="middle">En Ajustes → Licencia</text>
  <text x="761.0" y="192.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.1" fill="#1A1C1E" text-anchor="middle">verás ya puesto el ID de</text>
  <text x="761.0" y="216.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.1" fill="#1A1C1E" text-anchor="middle">tu licencia anterior.</text>
  <text x="761.0" y="240.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.1" fill="#1A1C1E" text-anchor="middle">Envía la solicitud: el viejo</text>
  <text x="761.0" y="264.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.1" fill="#1A1C1E" text-anchor="middle">se revoca y el nuevo activa.</text>
  <rect x="24.0" y="334.0" width="404.0" height="88.0" rx="14.0" fill="#FCE8E8" stroke="#C62828" stroke-width="1.5"/>
  <circle cx="52.0" cy="362.0" r="15.0" fill="#C62828"/>
  <g transform="translate(43.36, 353.36) scale(0.720)"><path d="M 12 5.99 19.53 19 H 4.47 L 12 5.99 M 12 2 1 21 h 22 L 12 2 z" fill="#FFFFFF"/><path d="M 13 16 h -2 v 2 h 2 z m 0 -6 h -2 v 5 h 2 z" fill="#FFFFFF"/></g>
  <text x="76" y="358" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.8" font-weight="bold" fill="#C62828">¡Guarda bien tu contraseña!</text>
  <text x="76" y="378" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.8" fill="#1A1C1E">Nadie puede recuperarla si la olvidas. Además,</text>
  <text x="76" y="395" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.8" fill="#1A1C1E">importar un respaldo reemplaza todos los datos</text>
  <text x="76" y="411" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.8" fill="#1A1C1E">actuales del teléfono donde lo abras.</text>
  <rect x="452.0" y="334.0" width="404.0" height="88.0" rx="14.0" fill="#E6EDFA" stroke="#2B4FA3" stroke-width="1.5"/>
  <circle cx="480.0" cy="362.0" r="15.0" fill="#2B4FA3"/>
  <g transform="translate(471.36, 353.36) scale(0.720)"><path d="M 19.35 10.04 A 7.49 7.49 0 0 0 12 4 C 9.11 4 6.6 5.64 5.35 8.04 A 5.994 5.994 0 0 0 0 14 c 0 3.31 2.69 6 6 6 h 13 c 2.76 0 5 -2.24 5 -5 0 -2.64 -2.05 -4.78 -4.65 -4.96 z M 14 13 v 4 h -4 v -4 H 7 l 5 -5 5 5 h -3 z" fill="#FFFFFF"/></g>
  <text x="504" y="358" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.8" font-weight="bold" fill="#2B4FA3">Recordatorio y respaldo al actualizar</text>
  <text x="504" y="378" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.8" fill="#1A1C1E">Shalev te avisa en Inicio si llevas 30 días sin</text>
  <text x="504" y="395" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.8" fill="#1A1C1E">exportar copia, y guarda un respaldo interno</text>
  <text x="504" y="411" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.8" fill="#1A1C1E">automático justo antes de instalar mejoras.</text>
