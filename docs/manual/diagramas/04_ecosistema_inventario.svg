  <text x="38" y="308" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1A1C1E">• Harina, queso, café, champú…</text>
  <text x="38" y="327" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1A1C1E">• Admiten hasta 3 decimales (kg, L)</text>
  <text x="38" y="346" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1A1C1E">• Si pones precio de venta, también</text>
